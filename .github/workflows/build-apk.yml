name: Build AvaCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare scripts
        run: |
          chmod +x gradlew
          chmod +x download_assets.sh

      - name: Download AvaCore assets
        run: ./download_assets.sh

      - name: Verify downloaded assets
        run: |
          set -e

          test -s app/libs/sherpa-onnx.aar
          test -s app/src/main/assets/tts/model_fa.onnx
          test -s app/src/main/assets/tts/tokens_fa.txt
          test -d app/src/main/assets/tts/espeak-ng-data

          echo "All AvaCore assets are ready."
          ls -lh app/libs/sherpa-onnx.aar
          ls -lh app/src/main/assets/tts/model_fa.onnx

      - name: Build Debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AvaCore-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
